<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lexend:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans+JP:wght@100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Orbitron:wght@400..900&family=Permanent+Marker&family=Playwrite+CU+Guides&family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&family=Roboto:ital,wght@0,100..900;1,100..900&family=Smythe&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <title>Restaurant Ordering App</title>
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Jimmy's Diner</h1>
        <p>The best burgers and pizzas in town.</p>
      </header>
      <section class="main-page">
        <section id="mainMenu" class="main-menu"></section>
        <section id="checkout" class="checkout">
          <h3 class="y-axis-margin">Your Order</h3>
          <div class="ordered-items" id="orderedItems">
            <div class="order-list" id="orderList"></div>
            <div class="order-list-flex y-axis-margin">
              <h3>Total price:</h3>
              <p id="totalCost"></p>
            </div>
            <button type="button" class="green-btn" id="completeOrder">
              Completer order
            </button>
          </div>
        </section>
        <section class="checkout-payment-modal">
          <div>
            <h2>Enter card details</h2>
            <button type="button" class="btn" id="closeBtn">X</button>
          </div>
          <form class="checkout-payment">
            <label for="name">Card Name:</label>
            <input
              type="text"
              id="name"
              class="form-input"
              name="card-name"
              placeholder="Enter your name"
              required
            />
            <label for="cardNumber"> Card Number:</label>
            <input
              type="text"
              inputmode="numeric"
              pattern="\d{1,16}"
              maxlength="16"
              id="cardNumber"
              class="form-input"
              name="card-number"
              placeholder="Enter card number"
              required
            />
            <label for="cvv"> CVV:</label>
            <input
              type="text"
              inputmode="numeric"
              pattern="\d{1,3}"
              maxlength="3"
              id="cvv"
              class="form-input"
              name="cvv"
              placeholder="Enter CVV"
              required
            />
            <button type="submit" class="green-btn">Pay</button>
          </form>
        </section>
      </section>
    </main>
    <script type="module" src="/index.js"></script>
  </body>
</html>
